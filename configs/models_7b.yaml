# models.yaml
embedding_model_path: ${MODELS_ROOT}/embedding_models/bge-small-en-v1.5
llm_model_path: ${MODELS_ROOT}/llm_models/Qwen2.5-7B-Instruct
classifier_model_path: ${MODELS_ROOT}/classifier_checkpoints/bert-base-uncased_safetensors
classifier_use_safetensors: true

use_vllm: false
load_in_4bit: false
load_in_8bit: false
device: cuda
fallback_device: cpu

# Generation args
max_new_tokens: 128
temperature: 0.0
top_p: 1.0
repetition_penalty: 1.0
